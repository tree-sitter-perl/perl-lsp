name: Demo page

# Publishes web/demo with a release build of the wasm server to GitHub
# Pages. Manual only: a deploy replaces the public page.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/wasm-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build the server
        run: scripts/wasm/build.sh --release

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"
          install-modules-with: cpm

      - name: Assemble the site
        working-directory: web
        env:
          # Unset, the page counts nothing.
          GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
        run: |
          npm ci --omit=dev
          cpm install -L "$RUNNER_TEMP/demo-perl" --cpanfile demo/project/cpanfile
          node build-site.mjs ../target/wasm32-wasip1-threads/release/perl-lsp.wasm "$RUNNER_TEMP/site" "$RUNNER_TEMP/demo-perl/lib/perl5"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  # A job of its own: the artifact listing lags the upload, and a deploy
  # step right behind it in the same job finds nothing to publish.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
