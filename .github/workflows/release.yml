name: Release

# Two ways in. Pushing a `v*` tag releases that tag. Merging a version bump
# to main releases it too: the `tag` job sees a Cargo.toml version with no tag
# yet and creates it with this run's GITHUB_TOKEN. A tag made by GITHUB_TOKEN
# starts no new workflow run, so this same run carries on with the release and
# nothing fires twice; every other push to main stops at the `tag` job.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  id-token: write  # needed for crates.io Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      # Every file that carries the version, plus the CHANGELOG section the
      # release body comes from. A bump that missed one stops here.
      - name: Version strings agree
        run: scripts/check-versions.sh --release

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          # Losing a race to a concurrent run (or a hand-pushed tag) leaves the
          # tag in place, and that run or push does the release.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                 -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            echo "Could not create $TAG (already created elsewhere?); not releasing from this run."
            exit 0
          fi
          echo "Created $TAG at $GITHUB_SHA."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Gate the release on the gold-corpus regression harness (exact-assertion
  # LSP-capability checks against a version-pinned module substrate).
  gold-corpus:
    name: Gold corpus
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `apt-get update` has wedged for 40-68 min on hosted runners (no output,
      # no failure) twice on this job, leaving Gold unverified while the build
      # and harness steps never start. The cap turns that silent hang into a
      # failure instead. It is deliberately well above the healthy time (under a
      # minute) because a merely SLOW mirror is not the failure being caught: a
      # 5-minute cap fired on a live PR and reported it as a gold regression,
      # which is a worse outcome than the hang. Retry first, cap only the hang.
      - name: System libraries (XS build deps)
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   libssl-dev libxml2-dev zlib1g-dev \
              && exit 0
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"
          install-modules-with: cpm

      - name: Cache corpus substrate
        uses: actions/cache@v5
        with:
          path: gold-corpus/local
          key: gold-corpus-${{ runner.os }}-perl5.38-${{ hashFiles('gold-corpus/cpanfile.snapshot') }}

      - name: Install pinned substrate (cpm + snapshot)
        working-directory: gold-corpus
        run: |
          cpm install -g Carton::Snapshot   # --resolver snapshot needs this to read cpanfile.snapshot
          cpm install -L local --resolver snapshot

      # The release gate has the same half-gate as CI's: a plain build
      # lang-skips the pack corpus and reports it green. Ship on the whole one.
      - name: Build release binary
        run: cargo build --release --features cpp

      - name: Run gold-corpus harness
        run: perl gold-corpus/run.pl

  publish-crate:
    name: Publish to crates.io
    needs: [tag, gold-corpus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Validate version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          TAG=${{ needs.tag.outputs.tag }}
          TAG_VERSION=${TAG#v}
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish || echo "Already published (idempotent)"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create the GitHub Release with hand-curated notes (the section for this tag
  # from CHANGELOG.md), prepended to GitHub's auto-generated commit list. Runs
  # before `build` so the release exists with its body before the matrix jobs
  # append platform binaries (those upload steps don't touch the body).
  release-notes:
    name: Release notes
    needs: [tag, publish-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Extract CHANGELOG section for this tag
        # Shared with the local preview (`scripts/release-notes.sh v0.5.0`) so
        # what you see locally is exactly what the release publishes. The
        # script prefix-matches the dated `## <tag> — <date>` header and falls
        # back to a stub body when no section exists.
        run: scripts/release-notes.sh "${{ needs.tag.outputs.tag }}" > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  build:
    name: Build ${{ matrix.target }}
    needs: [tag, release-notes]
    strategy:
      matrix:
        include:
          # Linux ships fully-static musl binaries (no glibc dependency → runs on
          # any distro, Alpine, scratch containers). aarch64 builds natively on
          # GitHub's arm runner, so the bundled C deps (SQLite, zstd, grammars)
          # need no cross toolchain — just musl-gcc from musl-tools.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # crt-static folds the VC runtime into the .exe so it doesn't depend
          # on vcruntime140.dll being present (UCRT itself ships with Win10+).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            rustflags: "-C target-feature=+crt-static"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../perl-lsp-${{ matrix.target }}.tar.gz perl-lsp
          cd ../../..

      - name: Package (windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../perl-lsp-${{ matrix.target }}.zip perl-lsp.exe
          cd ../../..

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: perl-lsp-${{ matrix.target }}.${{ matrix.archive }}

  # Publish the VS Code extension — a reusable workflow so it can also run
  # standalone (workflow_dispatch). Runs after `build` so the release assets
  # the extension references already exist.
  publish-extension:
    name: Publish VS Code extension
    needs: [tag, build]
    uses: ./.github/workflows/publish-extension.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
