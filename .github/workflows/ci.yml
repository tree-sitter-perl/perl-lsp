name: CI

on:
  push:
    branches: [main]
  # No base filter: every PR runs, whatever its base — so a PR stacked on
  # another feature branch is covered (the reason the default `[main]`
  # filter was dropped). Runs on PRs; doesn't *require* a green check —
  # that's branch protection, separate from this file.
  #
  # `edited` is added to the DEFAULT set (opened, synchronize, reopened)
  # because retargeting a PR's base fires `edited` and nothing else. That is
  # not an edge case for a stacked PR: squash-merging the bottom of a stack
  # orphans the rest, and the restack that follows ends in a retarget — so
  # without this the workflow is blind precisely where stacks live, and the
  # PR sits with zero checks rather than pending ones. Observed on #145.
  #
  # `edited` also fires on title/body edits, which cannot change what the code
  # does, so each job carries the guard `action != 'edited' || changes.base` —
  # run on a retarget, skip on a description tweak. On push and synchronize
  # `action` is not 'edited', so the first clause already passes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Cancel superseded runs when a PR branch is re-pushed.
#
# The no-op runs get their OWN group, and that is not a nicety. Every job here
# carries `action != 'edited' || changes.base`, so a title or description edit
# produces a run whose jobs all skip — but the run still exists, and under one
# shared group `cancel-in-progress` had it CANCEL the real run in flight for
# the same ref. Editing a PR description therefore killed its CI and left the
# PR showing three skipped checks: a green-looking result from a run that did
# nothing, which is the one failure mode a status check must never produce.
# Keying the no-op runs on `run_id` gives each of them a group of its own, so
# they cancel nothing; real runs keep sharing a group and keep superseding
# each other.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event.action == 'edited' && !github.event.changes.base) && github.run_id || 'real' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-tests:
    name: Rust tests
    if: github.event.action != 'edited' || github.event.changes.base   # see `on:`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--features cpp,php` everywhere the gate builds: a plain build serves
      # Perl only, so the pack half of the repo goes unchecked while the run stays
      # green — 61 unit tests never compiled, and gold reports its 255 pack rows
      # as lang-SKIPS rather than failures, which is the mode that hides a
      # regression behind a passing check. The unit gate adds `python`: its
      # cross-file tests run files through the driver, which only it compiles.
      - name: Build
        run: cargo build --features cpp,php,python

      - name: Test
        run: cargo test --features cpp,php,python

  e2e-tests:
    name: E2E tests (headless nvim)
    if: github.event.action != 'edited' || github.event.changes.base   # see `on:`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Changes no test TODAY — `run.sh` drives a fixed, Perl-only suite list, so
      # the pack suites (`e2e/run-cpp.sh`, its own lane) are unaffected by the
      # flag. It is here so CI's three build lines do not diverge and invite the
      # question of why this one is different. `release.yml` builds only the
      # languages a release ships, so it carries fewer features than these.
      - name: Build release binary
        run: cargo build --release --features cpp,php

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.0

      # The role suite's fixtures are Moo classes, and a Moo class inherits
      # Moo::Object: with that base off @INC the ancestry is incomplete and the
      # role-requires check stays silent by design. Install Moo at the version
      # gold-corpus/cpanfile.snapshot pins.
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"
          install-modules-with: cpm

      - name: Install Moo
        run: cpm install -L "$RUNNER_TEMP/e2e-perl" Moo@2.005005

      - name: Run e2e tests
        run: PERL5LIB="$PWD/test_files/lib:$RUNNER_TEMP/e2e-perl/lib/perl5" ./e2e/run.sh

  pack-e2e-tests:
    name: Pack E2E tests (headless nvim)
    if: github.event.action != 'edited' || github.event.changes.base   # see `on:`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.0

      # Separate from `e2e-tests` because the suites need `--features
      # cpp,python`, which the script builds itself — there is no flag to add
      # here. Covers the C/C++ suites AND `python_members`, so this is the
      # pack lane generally, not a cpp one.
      - name: Run pack e2e tests
        run: ./e2e/run-cpp.sh

  gold-corpus:
    name: Gold corpus
    if: github.event.action != 'edited' || github.event.changes.base   # see `on:`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # XS dists in the pinned substrate need system libraries to build.
      # `apt-get update` has wedged for 40-68 min on hosted runners (no output,
      # no failure) twice on this job, leaving Gold unverified while the build
      # and harness steps never start. The cap turns that silent hang into a
      # failure instead. It is deliberately well above the healthy time (under a
      # minute) because a merely SLOW mirror is not the failure being caught: a
      # 5-minute cap fired on a live PR and reported it as a gold regression,
      # which is a worse outcome than the hang. Retry first, cap only the hang.
      - name: System libraries (XS build deps)
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   libssl-dev libxml2-dev zlib1g-dev \
              && exit 0
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 5
          done
          exit 1

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.38"
          install-modules-with: cpm

      # Reproducible, version-pinned module tree. Cache keyed on the snapshot so
      # a cold install (~30s) only runs when the pinned set changes.
      - name: Cache corpus substrate
        uses: actions/cache@v5
        with:
          path: gold-corpus/local
          key: gold-corpus-${{ runner.os }}-perl5.38-${{ hashFiles('gold-corpus/cpanfile.snapshot') }}

      - name: Install pinned substrate (cpm + snapshot)
        working-directory: gold-corpus
        run: |
          cpm install -g Carton::Snapshot   # --resolver snapshot needs this to read cpanfile.snapshot
          cpm install -L local --resolver snapshot

      - name: Build release binary
        run: cargo build --release --features cpp,php   # see rust-tests' Build step

      - name: Run gold-corpus harness
        run: perl gold-corpus/run.pl
